[project]
name = "beammp-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ronpich man", email = "nobody@sonper.be" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
BeamMP-Helper = "beammp_helper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beammp_helper"]

[tool.ruff.format]
indent-style = "tab"

